server:
  port: 7080

spring:
  application:
    name: Gateway
  main:
    web-application-type: reactive
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    gateway:
      default-filters:
        - HeaderFilter
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        #         Public routes
        - id: user-register-route
          uri: lb://user-svc
          predicates:
            - Path=/api/v1/users/register

        - id: auth-service
          uri: lb://auth-svc
          predicates:
            - Path=/api/v1/auth/**

        #         Protected routes
        - id: user-service-all
          uri: lb://user-svc
          predicates:
            - Path=/api/v1/users/**
          filters:
            - AuthFilter

        - id: task-service-all
          uri: lb://task-svc
          predicates:
            - Path=/api/v1/tasks/**
          filters:
            - AuthFilter

eureka:
  client:
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:7111/eureka/

jwt:
  secretkey: 7f8e2b1c4d5a6e7f8e2b1c4d5a6e7f8e2b1c4d5a6e7f8e2b1c4d5a6e7f8e2b1c
